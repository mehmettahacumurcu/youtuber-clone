[project]
name = "youtuber-studio-runtime"
version = "1.0.0"
description = "Locked dependency-only build environment for the YouTuber Studio worker"
requires-python = ">=3.11,<3.12"
dependencies = [
    "datasets==3.6.0",
    "fastapi==0.136.1",
    "flagembedding==1.4.0",
    "gradio==5.50.0",
    "numpy==1.26.4",
    "pydantic==2.12.3",
    "pydantic-settings==2.14.1",
    "pyinstaller==6.21.0",
    "pyyaml==6.0.3",
    "qdrant-client==1.12.1",
    "rank-bm25==0.2.2",
    "requests==2.34.2",
    "soundfile==0.13.1",
    "torch==2.7.1+cpu",
    "transformers==4.57.6",
    "uvicorn==0.47.0",
]

[tool.uv]
package = false
index-strategy = "first-index"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
