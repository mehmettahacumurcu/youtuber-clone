[project]
name = "youtuber-clone"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24,<2",
    "pyannote-audio>=3.1,<3.3",
    "speechbrain<1.0",
    "huggingface-hub>=0.25,<1.0",
    "pydantic-settings>=2.14.1",
    "pyyaml>=6.0.3",
    "silero-vad>=6.2.1",
    "soundfile>=0.13.1",
    "torch>=2.6,<2.9",
    "torchaudio>=2.6,<2.9",
    "yt-dlp>=2026.3.17",
    "gradio>=4,<6",
    "faster-whisper>=1.2.1",
    "transformers>=4.45",
    "sentencepiece>=0.2.1",
    "qdrant-client>=1.12.1",
    "flagembedding>=1.3",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]

[tool.pytest.ini_options]
markers = ["slow: needs a real model download / network"]
