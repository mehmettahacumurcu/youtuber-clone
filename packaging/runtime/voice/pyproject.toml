[project]
name = "youtuber-voice-runtime"
version = "1.0.0"
description = "Locked dependency-only build environment for the YouTuber voice worker"
requires-python = ">=3.11,<3.12"
dependencies = [
    "coqui-tts==0.26.2",
    "einops==0.8.2",
    "faiss-cpu==1.13.2",
    "fastapi==0.140.13",
    "librosa==0.11.0",
    "noisereduce==3.0.3",
    "numpy==2.4.4",
    "pedalboard==0.9.24",
    "pydantic==2.12.3",
    "pydantic-settings==2.14.2",
    "pyinstaller==6.21.0",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "scipy==1.17.1",
    "soundfile==0.13.1",
    "soxr==1.1.0",
    "torch==2.7.1+cu128",
    "torchaudio==2.7.1+cu128",
    "torchcrepe==0.0.24",
    "torchfcpe==0.0.4",
    "transformers==4.48.3",
    "uvicorn==0.51.0",
    "wget==3.2",
]

[tool.uv]
package = false
index-strategy = "first-index"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
